name: Build MagnetMoney APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create React Native Project
        run: |
          npx react-native@0.73.0 init MagnetMoneyBuild --template react-native-template-typescript --skip-install
          cp UserApp.tsx MagnetMoneyBuild/App.tsx
          cp package.json MagnetMoneyBuild/package.json

      - name: Install Dependencies
        run: |
          cd MagnetMoneyBuild
          npm install

      - name: Create Keystore
        run: |
          mkdir -p MagnetMoneyBuild/android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > MagnetMoneyBuild/android/app/magnetmoney.keystore

      - name: Configure Signing
        run: |
          cat >> MagnetMoneyBuild/android/gradle.properties << EOF
          MYAPP_RELEASE_STORE_FILE=magnetmoney.keystore
          MYAPP_RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          MYAPP_RELEASE_STORE_PASSWORD=${{ secrets.KEY_STORE_PASSWORD }}
          MYAPP_RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Make Gradlew Executable
        run: chmod +x MagnetMoneyBuild/android/gradlew

      - name: Build Release APK
        run: |
          cd MagnetMoneyBuild/android
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MagnetMoney-APK
          path: MagnetMoneyBuild/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
